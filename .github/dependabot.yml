version: 2
updates:
  - package-ecosystem: "pub"
    # Google Fonts 9 requires Dart 3.13. Remove this bound when Flutter
    # and its CI/Docker toolchains are upgraded together; keep 8.x updates.
    ignore:
      - dependency-name: "google_fonts"
        versions: [">=9.0.0"]
      # flutter_localizations pins intl exactly at this SDK version.
      # Remove alongside the coordinated Flutter/Dart upgrade.
      - dependency-name: "intl"
        versions: [">=0.20.3"]
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "flutter"
    groups:
      pub-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:10"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "npm"
    groups:
      npm-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
