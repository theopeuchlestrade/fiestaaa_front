version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/"
    # Firebase Apple SDK 13 conflicts with google_sign_in_ios' Google SDK 9.
    # Remove these scoped deferrals when the official Flutter plugin supports 10.1.
    ignore:
      - dependency-name: "firebase_core"
        versions: [">=5.0.0, <6.0.0"]
      - dependency-name: "firebase_messaging"
        versions: [">=17.0.0, <18.0.0"]
      # 4.11.x requires firebase_core ^5.1.0; keep the Firebase 16 test interface.
      - dependency-name: "firebase_messaging_platform_interface"
        versions: [">=4.11.0, <4.12.0"]
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "flutter"
    groups:
      pub-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:10"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "npm"
    groups:
      npm-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    # Keep the maintained stable line. nginx 1.31.0 uses an older Alpine
    # package set that cannot install the security fixes pinned in Dockerfile.
    ignore:
      - dependency-name: "nginx"
        versions: [">=1.31.0, <1.32.0"]
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
