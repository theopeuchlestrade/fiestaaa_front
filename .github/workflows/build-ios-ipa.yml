name: Build iOS IPA

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build"
        required: true
        type: string
      version:
        description: "Flutter build name, for example 1.2.3"
        required: true
        type: string
      build_number:
        description: "Flutter build number"
        required: true
        type: string
      artifact_suffix:
        description: "Suffix used in uploaded artifact names"
        required: true
        type: string
      export_method:
        description: "Xcode export method"
        required: true
        type: string

jobs:
  build-ios-ipa:
    name: iOS IPA
    runs-on: macos-latest
    timeout-minutes: 70
    environment: production
    permissions:
      contents: read
    env:
      IOS_BUNDLE_ID: com.fiestaaa.fiestaaa
      IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_CODE_SIGN_IDENTITY: ${{ secrets.IOS_CODE_SIGN_IDENTITY }}
      IOS_EXPORT_METHOD: ${{ inputs.export_method }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          ref: ${{ inputs.ref }}

      - name: Validate build inputs
        run: |
          if ! [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must use MAJOR.MINOR.PATCH, for example 1.2.3"
            exit 1
          fi
          if ! [[ "${{ inputs.build_number }}" =~ ^[0-9]+$ ]]; then
            echo "::error::build_number must be a positive integer"
            exit 1
          fi
          case "${IOS_EXPORT_METHOD}" in
            debugging|release-testing|app-store-connect) ;;
            *)
              echo "::error::Unsupported export_method: ${IOS_EXPORT_METHOD}"
              exit 1
              ;;
          esac

      - name: Check required secrets
        env:
          FIESTAAA_API_BASE_URL: ${{ secrets.FIESTAAA_API_BASE_URL }}
          FIESTAAA_APPLE_REDIRECT_URI: ${{ secrets.FIESTAAA_APPLE_REDIRECT_URI }}
          FIESTAAA_APPLE_SERVICE_ID: ${{ secrets.FIESTAAA_APPLE_SERVICE_ID }}
          FIESTAAA_FCM_VAPID_KEY: ${{ secrets.FIESTAAA_FCM_VAPID_KEY }}
          FIESTAAA_GOOGLE_WEB_CLIENT_ID: ${{ secrets.FIESTAAA_GOOGLE_WEB_CLIENT_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_IOS_API_KEY: ${{ secrets.FIREBASE_IOS_API_KEY }}
          FIREBASE_IOS_APP_ID: ${{ secrets.FIREBASE_IOS_APP_ID }}
          FIREBASE_IOS_BUNDLE_ID: ${{ secrets.FIREBASE_IOS_BUNDLE_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_WEB_APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID }}
        run: |
          missing=0
          for var in FIESTAAA_API_BASE_URL FIESTAAA_APPLE_REDIRECT_URI FIESTAAA_APPLE_SERVICE_ID FIESTAAA_FCM_VAPID_KEY FIESTAAA_GOOGLE_WEB_CLIENT_ID FIREBASE_MESSAGING_SENDER_ID FIREBASE_PROJECT_ID FIREBASE_STORAGE_BUCKET FIREBASE_WEB_API_KEY FIREBASE_WEB_APP_ID FIREBASE_IOS_API_KEY FIREBASE_IOS_APP_ID FIREBASE_IOS_BUNDLE_ID IOS_CERTIFICATE_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64; do
            if [ -z "${!var}" ]; then
              echo "::error::$var manquant"
              missing=1
            fi
          done
          if [ -n "$FIREBASE_IOS_BUNDLE_ID" ] && [ "$FIREBASE_IOS_BUNDLE_ID" != "$IOS_BUNDLE_ID" ]; then
            echo "::error::FIREBASE_IOS_BUNDLE_ID doit correspondre a $IOS_BUNDLE_ID"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.44.0
          cache: false

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Write .env
        run: |
          FIREBASE_AUTH_DOMAIN_VALUE="${{ secrets.FIREBASE_AUTH_DOMAIN }}"
          if [ -z "$FIREBASE_AUTH_DOMAIN_VALUE" ]; then
            FIREBASE_AUTH_DOMAIN_VALUE="${{ secrets.FIREBASE_PROJECT_ID }}.firebaseapp.com"
          fi
          cat <<EOF > .env
          FIESTAAA_API_BASE_URL=${{ secrets.FIESTAAA_API_BASE_URL }}
          FIESTAAA_APP_BASE_URL=${{ secrets.FIESTAAA_APP_BASE_URL || 'https://fiestaaa.app' }}
          FIESTAAA_APPLE_SERVICE_ID=${{ secrets.FIESTAAA_APPLE_SERVICE_ID }}
          FIESTAAA_APPLE_REDIRECT_URI=${{ secrets.FIESTAAA_APPLE_REDIRECT_URI }}
          FIESTAAA_FCM_VAPID_KEY=${{ secrets.FIESTAAA_FCM_VAPID_KEY }}
          FIESTAAA_GOOGLE_WEB_CLIENT_ID=${{ secrets.FIESTAAA_GOOGLE_WEB_CLIENT_ID }}
          FIESTAAA_SENTRY_DSN=${{ secrets.FIESTAAA_SENTRY_DSN }}
          FIESTAAA_SENTRY_ENVIRONMENT=${{ vars.FIESTAAA_SENTRY_ENVIRONMENT || 'production' }}
          FIESTAAA_SENTRY_RELEASE=${{ inputs.artifact_suffix }}
          FIESTAAA_SENTRY_TRACES_SAMPLE_RATE=${{ vars.FIESTAAA_SENTRY_TRACES_SAMPLE_RATE || '0' }}
          FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_WEB_API_KEY=${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_WEB_APP_ID=${{ secrets.FIREBASE_WEB_APP_ID }}
          FIREBASE_WEB_MEASUREMENT_ID=${{ secrets.FIREBASE_WEB_MEASUREMENT_ID }}
          FIREBASE_IOS_API_KEY=${{ secrets.FIREBASE_IOS_API_KEY }}
          FIREBASE_IOS_APP_ID=${{ secrets.FIREBASE_IOS_APP_ID }}
          FIREBASE_IOS_BUNDLE_ID=${{ secrets.FIREBASE_IOS_BUNDLE_ID }}
          FIREBASE_AUTH_DOMAIN=${FIREBASE_AUTH_DOMAIN_VALUE}
          EOF

      - name: Install signing certificate and provisioning profile
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/build_profile.mobileprovision"
          PROFILE_PLIST_PATH="$RUNNER_TEMP/build_profile.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST_PATH"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$PROFILE_PLIST_PATH")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$PROFILE_PLIST_PATH")
          PROFILE_TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print TeamIdentifier:0" "$PROFILE_PLIST_PATH")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c "Print Entitlements:application-identifier" "$PROFILE_PLIST_PATH")
          PROFILE_BUNDLE_ID="${PROFILE_APP_ID#*.}"

          if [ "$PROFILE_BUNDLE_ID" != "$IOS_BUNDLE_ID" ] && [ "$PROFILE_BUNDLE_ID" != "*" ]; then
            echo "::error::Provisioning profile bundle id ($PROFILE_BUNDLE_ID) does not match $IOS_BUNDLE_ID"
            exit 1
          fi

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          if [ -z "$IOS_TEAM_ID" ]; then
            IOS_TEAM_ID="$PROFILE_TEAM_ID"
          fi
          if [ -z "$IOS_CODE_SIGN_IDENTITY" ]; then
            case "$IOS_EXPORT_METHOD" in
              debugging) IOS_CODE_SIGN_IDENTITY="Apple Development" ;;
              *) IOS_CODE_SIGN_IDENTITY="Apple Distribution" ;;
            esac
          fi

          {
            echo "IOS_KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "IOS_PROFILE_NAME=$PROFILE_NAME"
            echo "IOS_PROFILE_UUID=$PROFILE_UUID"
            echo "IOS_TEAM_ID=$IOS_TEAM_ID"
            echo "IOS_CODE_SIGN_IDENTITY=$IOS_CODE_SIGN_IDENTITY"
          } >> "$GITHUB_ENV"
          echo "Installed provisioning profile: $PROFILE_NAME"

      - name: Write export options
        run: |
          cat <<EOF > "$RUNNER_TEMP/ExportOptions.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>export</string>
            <key>method</key>
            <string>${IOS_EXPORT_METHOD}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${IOS_BUNDLE_ID}</key>
              <string>${IOS_PROFILE_NAME}</string>
            </dict>
            <key>signingCertificate</key>
            <string>${IOS_CODE_SIGN_IDENTITY}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>teamID</key>
            <string>${IOS_TEAM_ID}</string>
          </dict>
          </plist>
          EOF
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Prepare unsigned iOS build
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --build-name "${{ inputs.version }}" \
            --build-number "${{ inputs.build_number }}" \
            --dart-define-from-file=.env

      - name: Configure Runner signing
        run: |
          ruby <<'RUBY'
          project_path = "ios/Runner.xcodeproj/project.pbxproj"
          text = File.read(project_path)

          list_match = text.match(%r{
            [A-F0-9]+[[:space:]]/\*[[:space:]]Build\ configuration\ list\ for\ PBXNativeTarget\ "Runner"[[:space:]]\*/[[:space:]]=\s*\{
            .*?
            buildConfigurations\s*=\s*\(
            (?<configs>.*?)
            \n\t\t\t\);
          }mx)
          raise "Runner build configuration list not found" unless list_match

          config_ids = list_match[:configs].scan(/([A-F0-9]+) \/\* (?:Debug|Release|Profile) \*\//).flatten
          raise "Runner build configurations not found" if config_ids.empty?

          def pbx_quote(value)
            '"' + value.gsub("\\", "\\\\\\").gsub('"', "\\\"") + '"'
          end

          signing_settings = {
            "CODE_SIGN_STYLE" => "Manual",
            "CODE_SIGN_IDENTITY" => ENV.fetch("IOS_CODE_SIGN_IDENTITY"),
            '"CODE_SIGN_IDENTITY[sdk=iphoneos*]"' => ENV.fetch("IOS_CODE_SIGN_IDENTITY"),
            "DEVELOPMENT_TEAM" => ENV.fetch("IOS_TEAM_ID"),
            "PROVISIONING_PROFILE" => ENV.fetch("IOS_PROFILE_UUID"),
            "PROVISIONING_PROFILE_SPECIFIER" => ENV.fetch("IOS_PROFILE_NAME"),
            "PRODUCT_BUNDLE_IDENTIFIER" => ENV.fetch("IOS_BUNDLE_ID"),
          }

          config_ids.each do |config_id|
            object_pattern = /
              (\t\t#{Regexp.escape(config_id)}\ \/\*\ .*?\ \*\/\ =\ \{\n
              \t\t\tisa\ =\ XCBuildConfiguration;\n
              .*?
              \t\t\};)
            /mx
            text.sub!(object_pattern) do |object|
              object.sub(/(\t\t\tbuildSettings = \{\n)(.*?)(\t\t\t\};)/m) do
                opener = Regexp.last_match(1)
                body = Regexp.last_match(2)
                closer = Regexp.last_match(3)

                signing_settings.each do |key, value|
                  line = "\t\t\t\t#{key} = #{pbx_quote(value)};\n"
                  key_pattern = /^\t\t\t\t#{Regexp.escape(key)} = .*;\n/
                  if body.match?(key_pattern)
                    body.sub!(key_pattern, line)
                  else
                    body << line
                  end
                end

                opener + body + closer
              end
            end || raise("Build configuration #{config_id} not found")
          end

          File.write(project_path, text)
          RUBY

      - name: Archive iOS app
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/ios/archive/Runner.xcarchive \
            OTHER_CODE_SIGN_FLAGS="--keychain $IOS_KEYCHAIN_PATH"

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: fiestaaa-ios-ipa-${{ inputs.export_method }}-${{ inputs.artifact_suffix }}
          path: build/ios/ipa/*.ipa
          if-no-files-found: error

      - name: Clean up signing keychain
        if: ${{ always() }}
        run: |
          if [ -n "${IOS_KEYCHAIN_PATH:-}" ] && [ -f "$IOS_KEYCHAIN_PATH" ]; then
            security delete-keychain "$IOS_KEYCHAIN_PATH" || true
          fi
