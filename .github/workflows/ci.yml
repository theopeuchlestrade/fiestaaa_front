name: Frontend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  openspec:
    name: OpenSpec
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENSPEC_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run spec:validate

  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Run actionlint
        run: docker run --rm -v "${PWD}:/repo" --workdir /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Run gitleaks
        run: docker run --rm -v "${PWD}:/repo" --workdir /repo ghcr.io/gitleaks/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 detect --source=. --redact=100 --verbose

  dockerfile-check:
    name: Dockerfile Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Check Dockerfile
        run: docker build --check .

  backend-contract:
    name: Backend Contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Verify generated public pages
        run: |
          node tool/generate_public_pages.mjs
          git diff --exit-code -- web/privacy web/terms web/support web/delete-account

      - name: Verify backend OpenAPI snapshot
        run: npm run contract:backend

  quality:
    name: Analyze and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup coverage tooling
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'

      - name: Test coverage report and publication guards
        run: npm run coverage:test

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Run analyze
        run: flutter analyze

      - name: Write CI defines
        run: |
          cat <<'EOF' > .env.ci
          FIESTAAA_API_BASE_URL=https://api.example.test
          FIESTAAA_APP_BASE_URL=https://fiestaaa.example.test
          FIESTAAA_APPLE_SERVICE_ID=com.example.fiestaaa.web
          FIESTAAA_APPLE_REDIRECT_URI=https://fiestaaa.example.test/auth/callback
          FIESTAAA_FCM_VAPID_KEY=test-vapid-key
          FIESTAAA_GOOGLE_WEB_CLIENT_ID=test-web-client-id.apps.googleusercontent.com
          FIESTAAA_SENTRY_DSN=
          FIESTAAA_SENTRY_ENVIRONMENT=ci
          FIESTAAA_SENTRY_RELEASE=ci
          FIESTAAA_SENTRY_TRACES_SAMPLE_RATE=0
          FIREBASE_PROJECT_ID=fiestaaa-test
          FIREBASE_STORAGE_BUCKET=fiestaaa-test.firebasestorage.app
          FIREBASE_MESSAGING_SENDER_ID=123456789012
          FIREBASE_WEB_API_KEY=test-web-api-key
          FIREBASE_WEB_APP_ID=1:123456789012:web:testappid
          FIREBASE_WEB_MEASUREMENT_ID=
          FIREBASE_AUTH_DOMAIN=fiestaaa-test.firebaseapp.com
          FIREBASE_ANDROID_API_KEY=test-android-api-key
          FIREBASE_ANDROID_APP_ID=1:123456789012:android:testappid
          FIREBASE_IOS_API_KEY=test-ios-api-key
          FIREBASE_IOS_APP_ID=1:123456789012:ios:testappid
          FIREBASE_IOS_BUNDLE_ID=com.fiestaaa.fiestaaa
          EOF

      - name: Run tests with coverage
        run: flutter test --coverage --dart-define-from-file=.env.ci

      - name: Test browser storage and link adapters (not instrumented by Dart VM)
        run: flutter test --platform chrome test/browser/platform_storage_browser.dart test/browser/calendar_native_browser.dart --dart-define-from-file=.env.ci

      - name: Upload visual failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-visual-failures
          path: test/features/events/presentation/failures
          if-no-files-found: ignore

      - name: Enforce coverage policy and summarize
        env:
          COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$COVERAGE_BASE_SHA" ]; then
            npm run coverage:report -- --base "$COVERAGE_BASE_SHA"
          else
            npm run coverage:report
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage-report
          path: coverage/report
          if-no-files-found: error
          retention-days: 7

  web-container-build:
    name: Web Container Build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build production web image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: ghcr.io/${{ github.repository }}:ci-${{ github.sha }}
          build-args: |
            FIESTAAA_API_BASE_URL=https://api.example.test
            FIESTAAA_APP_BASE_URL=https://fiestaaa.example.test
            FIESTAAA_APPLE_REDIRECT_URI=https://fiestaaa.example.test/auth/callback
            FIESTAAA_APPLE_SERVICE_ID=com.example.fiestaaa.web
            FIESTAAA_GOOGLE_WEB_CLIENT_ID=test-web-client-id.apps.googleusercontent.com
            FIESTAAA_SENTRY_DSN=
            FIESTAAA_SENTRY_ENVIRONMENT=ci
            FIESTAAA_SENTRY_RELEASE=ci-${{ github.sha }}
            FIESTAAA_SENTRY_TRACES_SAMPLE_RATE=0
            FIREBASE_MESSAGING_SENDER_ID=123456789012
            FIREBASE_PROJECT_ID=fiestaaa-test
            FIREBASE_STORAGE_BUCKET=fiestaaa-test.firebasestorage.app
            FIREBASE_WEB_APP_ID=1:123456789012:web:testappid
            FIREBASE_WEB_MEASUREMENT_ID=
          secrets: |
            FIESTAAA_FCM_VAPID_KEY=test-vapid-key
            FIREBASE_WEB_API_KEY=test-web-api-key
            FIREBASE_AUTH_DOMAIN=fiestaaa-test.firebaseapp.com

      - name: Install smoke test dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke test web image
        run: |
          docker run -d --rm --name fiestaaa-front-ci -p 8080:8080 ghcr.io/${{ github.repository }}:ci-${{ github.sha }}
          trap 'docker stop fiestaaa-front-ci' EXIT
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then
              break
            fi
            sleep 1
          done
          npm run smoke:web -- --url http://127.0.0.1:8080 --timeout-ms 60000 --expect-csp-origin https://api.example.test

  android-build:
    name: Android Compile
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Verify Android build JDK
        run: |
          java -version
          flutter config --jdk-dir "$JAVA_HOME"

      - name: Write CI defines
        run: |
          cat <<'EOF' > .env.ci
          FIESTAAA_API_BASE_URL=https://api.example.test
          FIESTAAA_APP_BASE_URL=https://fiestaaa.example.test
          FIESTAAA_APPLE_SERVICE_ID=com.example.fiestaaa.web
          FIESTAAA_APPLE_REDIRECT_URI=https://fiestaaa.example.test/auth/callback
          FIESTAAA_FCM_VAPID_KEY=test-vapid-key
          FIESTAAA_GOOGLE_WEB_CLIENT_ID=test-web-client-id.apps.googleusercontent.com
          FIESTAAA_SENTRY_DSN=
          FIESTAAA_SENTRY_ENVIRONMENT=ci
          FIESTAAA_SENTRY_RELEASE=ci
          FIESTAAA_SENTRY_TRACES_SAMPLE_RATE=0
          FIREBASE_PROJECT_ID=fiestaaa-test
          FIREBASE_STORAGE_BUCKET=fiestaaa-test.firebasestorage.app
          FIREBASE_MESSAGING_SENDER_ID=123456789012
          FIREBASE_WEB_API_KEY=test-web-api-key
          FIREBASE_WEB_APP_ID=1:123456789012:web:testappid
          FIREBASE_WEB_MEASUREMENT_ID=
          FIREBASE_AUTH_DOMAIN=fiestaaa-test.firebaseapp.com
          FIREBASE_ANDROID_API_KEY=test-android-api-key
          FIREBASE_ANDROID_APP_ID=1:123456789012:android:testappid
          FIREBASE_IOS_API_KEY=test-ios-api-key
          FIREBASE_IOS_APP_ID=1:123456789012:ios:testappid
          FIREBASE_IOS_BUNDLE_ID=com.fiestaaa.fiestaaa
          EOF

      - name: Write dummy google-services.json
        run: |
          mkdir -p android/app
          cat <<'EOF' > android/app/google-services.json
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "fiestaaa-test",
              "storage_bucket": "fiestaaa-test.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:testappid",
                  "android_client_info": {
                    "package_name": "com.fiestaaa.fiestaaa"
                  }
                },
                "api_key": [
                  {
                    "current_key": "test-android-api-key"
                  }
                ]
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Build Android debug APK
        run: flutter build apk --debug --dart-define-from-file=.env.ci

      - name: Report Gradle JVM after Flutter generates the wrapper
        working-directory: android
        run: ./gradlew --version

      - name: Build Android release APK and app bundle
        # CI uses the existing local/debug signing fallback, never store keys.
        run: |
          flutter build apk --release --dart-define-from-file=.env.ci
          flutter build appbundle --release --dart-define-from-file=.env.ci

  ios-build:
    name: iOS Compile
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Write CI defines
        run: |
          cat <<'EOF' > .env.ci
          FIESTAAA_API_BASE_URL=https://api.example.test
          FIESTAAA_APP_BASE_URL=https://fiestaaa.example.test
          FIESTAAA_APPLE_SERVICE_ID=com.example.fiestaaa.web
          FIESTAAA_APPLE_REDIRECT_URI=https://fiestaaa.example.test/auth/callback
          FIESTAAA_FCM_VAPID_KEY=test-vapid-key
          FIESTAAA_GOOGLE_WEB_CLIENT_ID=test-web-client-id.apps.googleusercontent.com
          FIESTAAA_SENTRY_DSN=
          FIESTAAA_SENTRY_ENVIRONMENT=ci
          FIESTAAA_SENTRY_RELEASE=ci
          FIESTAAA_SENTRY_TRACES_SAMPLE_RATE=0
          FIREBASE_PROJECT_ID=fiestaaa-test
          FIREBASE_STORAGE_BUCKET=fiestaaa-test.firebasestorage.app
          FIREBASE_MESSAGING_SENDER_ID=123456789012
          FIREBASE_WEB_API_KEY=test-web-api-key
          FIREBASE_WEB_APP_ID=1:123456789012:web:testappid
          FIREBASE_WEB_MEASUREMENT_ID=
          FIREBASE_AUTH_DOMAIN=fiestaaa-test.firebaseapp.com
          FIREBASE_ANDROID_API_KEY=test-android-api-key
          FIREBASE_ANDROID_APP_ID=1:123456789012:android:testappid
          FIREBASE_IOS_API_KEY=test-ios-api-key
          FIREBASE_IOS_APP_ID=1:123456789012:ios:testappid
          FIREBASE_IOS_BUNDLE_ID=com.fiestaaa.fiestaaa
          EOF

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Reset SwiftPM artifact cache
        run: rm -rf "$HOME/Library/Caches/org.swift.swiftpm/artifacts"

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign --dart-define-from-file=.env.ci

  ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    needs:
      - openspec
      - workflow-lint
      - secret-scan
      - dockerfile-check
      - backend-contract
      - quality
      - web-container-build
      - android-build
      - ios-build
    if: ${{ always() }}
    steps:
      - name: Check required jobs
        run: |
          if [ "${{ needs.openspec.result }}" != "success" ] ||
             [ "${{ needs.workflow-lint.result }}" != "success" ] ||
             [ "${{ needs.secret-scan.result }}" != "success" ] ||
             [ "${{ needs.dockerfile-check.result }}" != "success" ] ||
             [ "${{ needs.backend-contract.result }}" != "success" ] ||
             [ "${{ needs.quality.result }}" != "success" ] ||
             [ "${{ needs.web-container-build.result }}" != "success" ] ||
             [ "${{ needs.android-build.result }}" != "success" ]; then
            echo "::error::One or more frontend CI jobs failed"
            exit 1
          fi
          if [ "${{ needs.ios-build.result }}" != "success" ]; then
            echo "::error::iOS compile job failed or was skipped"
            exit 1
          fi
