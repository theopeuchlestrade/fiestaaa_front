name: Frontend CI

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: 3.41.5
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Run analyze
        run: flutter analyze

      - name: Write CI defines
        run: |
          cat <<'EOF' > .env.ci
          FIESTAAA_API_BASE_URL=https://api.example.test
          FIESTAAA_APP_BASE_URL=https://fiestaaa.example.test
          FIESTAAA_APPLE_SERVICE_ID=com.example.fiestaaa.web
          FIESTAAA_APPLE_REDIRECT_URI=https://fiestaaa.example.test/auth/callback
          FIESTAAA_FCM_VAPID_KEY=test-vapid-key
          FIESTAAA_GOOGLE_WEB_CLIENT_ID=test-web-client-id.apps.googleusercontent.com
          FIREBASE_PROJECT_ID=fiestaaa-test
          FIREBASE_STORAGE_BUCKET=fiestaaa-test.firebasestorage.app
          FIREBASE_MESSAGING_SENDER_ID=123456789012
          FIREBASE_WEB_API_KEY=test-web-api-key
          FIREBASE_WEB_APP_ID=1:123456789012:web:testappid
          FIREBASE_WEB_MEASUREMENT_ID=
          FIREBASE_AUTH_DOMAIN=fiestaaa-test.firebaseapp.com
          FIREBASE_ANDROID_API_KEY=test-android-api-key
          FIREBASE_ANDROID_APP_ID=1:123456789012:android:testappid
          FIREBASE_IOS_API_KEY=test-ios-api-key
          FIREBASE_IOS_APP_ID=1:123456789012:ios:testappid
          FIREBASE_IOS_BUNDLE_ID=com.example.fiestaaa
          EOF

      - name: Run tests
        run: flutter test --dart-define-from-file=.env.ci
