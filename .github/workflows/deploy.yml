name: Build and Deploy Front
on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      force_build:
        description: "Ignore existing image and rebuild"
        type: boolean
        default: false
      skip_deploy:
        description: "Build and push the image, but skip VPS deployment"
        type: boolean
        default: false

env:
  IMAGE: ghcr.io/theopeuchlestrade/fiestaaa_front
  TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://fiestaaa.app
    permissions:
      contents: read
      attestations: write
      artifact-metadata: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Check required secrets
        env:
          FIESTAAA_API_BASE_URL: ${{ secrets.FIESTAAA_API_BASE_URL }}
          FIESTAAA_APPLE_REDIRECT_URI: ${{ secrets.FIESTAAA_APPLE_REDIRECT_URI }}
          FIESTAAA_APPLE_SERVICE_ID: ${{ secrets.FIESTAAA_APPLE_SERVICE_ID }}
          FIESTAAA_FCM_VAPID_KEY: ${{ secrets.FIESTAAA_FCM_VAPID_KEY }}
          FIESTAAA_GOOGLE_WEB_CLIENT_ID: ${{ secrets.FIESTAAA_GOOGLE_WEB_CLIENT_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_WEB_APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          SKIP_DEPLOY: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_deploy }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          missing=0
          for var in FIESTAAA_API_BASE_URL FIESTAAA_APPLE_REDIRECT_URI FIESTAAA_APPLE_SERVICE_ID FIESTAAA_FCM_VAPID_KEY FIESTAAA_GOOGLE_WEB_CLIENT_ID FIREBASE_MESSAGING_SENDER_ID FIREBASE_PROJECT_ID FIREBASE_STORAGE_BUCKET FIREBASE_WEB_API_KEY FIREBASE_WEB_APP_ID GHCR_TOKEN VPS_HOST VPS_PORT VPS_SSH_KEY VPS_USER; do
            if [ "${SKIP_DEPLOY}" = "true" ]; then
              case "$var" in GHCR_TOKEN|VPS_HOST|VPS_PORT|VPS_SSH_KEY|VPS_USER) continue ;; esac
            fi
            if [ -z "${!var}" ]; then
              echo "::error::$var manquant"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Login to GHCR for push
        uses: docker/login-action@v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: Check if image exists
        id: image_exists
        run: |
          if docker manifest inspect "$IMAGE:$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image
        id: push
        if: steps.image_exists.outputs.exists == 'false' || (github.event_name == 'workflow_dispatch' && github.event.inputs.force_build == 'true')
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
          build-args: |
            FIESTAAA_API_BASE_URL=${{ secrets.FIESTAAA_API_BASE_URL }}
            FIESTAAA_APPLE_REDIRECT_URI=${{ secrets.FIESTAAA_APPLE_REDIRECT_URI }}
            FIESTAAA_APPLE_SERVICE_ID=${{ secrets.FIESTAAA_APPLE_SERVICE_ID }}
            FIESTAAA_GOOGLE_WEB_CLIENT_ID=${{ secrets.FIESTAAA_GOOGLE_WEB_CLIENT_ID }}
            FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
            FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
            FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}
            FIREBASE_WEB_APP_ID=${{ secrets.FIREBASE_WEB_APP_ID }}
            FIREBASE_WEB_MEASUREMENT_ID=${{ secrets.FIREBASE_WEB_MEASUREMENT_ID }}
          secrets: |
            FIESTAAA_FCM_VAPID_KEY=${{ secrets.FIESTAAA_FCM_VAPID_KEY }}
            FIREBASE_WEB_API_KEY=${{ secrets.FIREBASE_WEB_API_KEY }}
            FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }}

      - name: Generate image attestation
        if: steps.push.outputs.digest != '' && !github.event.repository.private
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Check VPS bootstrap state
        id: bootstrap
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_deploy) }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          key_path="${RUNNER_TEMP}/fiestaaa_deploy"
          printf '%s\n' "${VPS_SSH_KEY}" > "${key_path}"
          chmod 600 "${key_path}"
          api_image_tag="$(
            ssh -i "${key_path}" \
              -p "${VPS_PORT}" \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=accept-new \
              "${VPS_USER}@${VPS_HOST}" \
              "grep '^API_IMAGE_TAG=' ~/apps/fiestaaa/.env 2>/dev/null | cut -d= -f2- || true"
          )"
          rm -f "${key_path}"
          if [ -z "${api_image_tag}" ]; then
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Bootstrap initial non detecte: le deploy front est ignore jusqu'au workflow Bootstrap VPS Stack."
          else
            echo "ready=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Deploy to VPS
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_deploy) && steps.bootstrap.outputs.ready == 'true' }}
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: GHCR_USERNAME,GHCR_TOKEN,TAG
          script: |
            set -euo pipefail
            cd ~/apps/fiestaaa
            current_api_image_tag="$(grep '^API_IMAGE_TAG=' .env 2>/dev/null | cut -d= -f2- || true)"
            if [ -z "${current_api_image_tag}" ]; then
              echo "API_IMAGE_TAG missing in ~/apps/fiestaaa/.env. Seed both API_IMAGE_TAG and FRONT_IMAGE_TAG before the first deployment." >&2
              exit 1
            fi
            tmp_env="$(mktemp)"
            if [ -f .env ]; then
              grep -vE '^(API_IMAGE_TAG|FRONT_IMAGE_TAG)=' .env > "${tmp_env}" || true
            fi
            cat "${tmp_env}" > .env
            {
              echo "API_IMAGE_TAG=${current_api_image_tag}"
              echo "FRONT_IMAGE_TAG=${TAG}"
            } >> .env
            chmod 600 .env
            rm -f "${tmp_env}"
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin
            compose_cmd="docker compose"
            if ! docker compose version >/dev/null 2>&1; then
              if command -v docker-compose >/dev/null 2>&1; then
                compose_cmd="docker-compose"
              else
                echo "docker compose/docker-compose not found on the VPS" >&2
                exit 1
              fi
            fi
            ${compose_cmd} pull front
            # Avoid restarting the API/DB if they are already in place
            ${compose_cmd} up -d --no-deps front
            ${compose_cmd} ps
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          TAG: ${{ github.sha }}

      - name: Verify public smoke checks
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_deploy) && steps.bootstrap.outputs.ready == 'true' }}
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors https://api.fiestaaa.app/health
          curl --fail --silent --show-error --head --retry 12 --retry-delay 5 --retry-all-errors https://fiestaaa.app

      - name: Setup Node for browser smoke check
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_deploy) && steps.bootstrap.outputs.ready == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install browser smoke dependencies
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_deploy) && steps.bootstrap.outputs.ready == 'true' }}
        run: npm ci

      - name: Install Playwright Chromium
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_deploy) && steps.bootstrap.outputs.ready == 'true' }}
        run: npx playwright install --with-deps chromium

      - name: Verify browser smoke check
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_deploy) && steps.bootstrap.outputs.ready == 'true' }}
        run: npm run smoke:web -- --url https://fiestaaa.app
