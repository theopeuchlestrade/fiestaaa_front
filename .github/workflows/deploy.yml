name: Frontend Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Version bump to apply"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: "Required only when release_type=custom, without the v prefix"
        required: false
        type: string
      build_number:
        description: "Mobile build number. Defaults to the GitHub run number when empty."
        required: false
        type: string
      deploy_to_vps:
        description: "Deploy the released web image to the production VPS"
        required: true
        type: boolean
        default: true
      build_ios:
        description: "Build the signed iOS IPA"
        required: true
        type: boolean
        default: true
      ios_export_method:
        description: "Xcode export method"
        required: true
        default: release-testing
        type: choice
        options:
          - debugging
          - release-testing
          - app-store-connect

concurrency:
  group: frontend-release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  attestations: write
  artifact-metadata: write
  id-token: write

env:
  FLUTTER_VERSION: 3.44.0
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  verify:
    name: Verify Release Candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Run analyze
        run: flutter analyze

      - name: Write CI defines
        run: |
          cat <<'EOF' > .env.ci
          FIESTAAA_API_BASE_URL=https://api.example.test
          FIESTAAA_APP_BASE_URL=https://fiestaaa.example.test
          FIESTAAA_APPLE_SERVICE_ID=com.example.fiestaaa.web
          FIESTAAA_APPLE_REDIRECT_URI=https://fiestaaa.example.test/auth/callback
          FIESTAAA_FCM_VAPID_KEY=test-vapid-key
          FIESTAAA_GOOGLE_WEB_CLIENT_ID=test-web-client-id.apps.googleusercontent.com
          FIESTAAA_SENTRY_DSN=
          FIESTAAA_SENTRY_ENVIRONMENT=ci
          FIESTAAA_SENTRY_RELEASE=release-candidate
          FIESTAAA_SENTRY_TRACES_SAMPLE_RATE=0
          FIREBASE_PROJECT_ID=fiestaaa-test
          FIREBASE_STORAGE_BUCKET=fiestaaa-test.firebasestorage.app
          FIREBASE_MESSAGING_SENDER_ID=123456789012
          FIREBASE_WEB_API_KEY=test-web-api-key
          FIREBASE_WEB_APP_ID=1:123456789012:web:testappid
          FIREBASE_WEB_MEASUREMENT_ID=
          FIREBASE_AUTH_DOMAIN=fiestaaa-test.firebaseapp.com
          FIREBASE_ANDROID_API_KEY=test-android-api-key
          FIREBASE_ANDROID_APP_ID=1:123456789012:android:testappid
          FIREBASE_IOS_API_KEY=test-ios-api-key
          FIREBASE_IOS_APP_ID=1:123456789012:ios:testappid
          FIREBASE_IOS_BUNDLE_ID=com.fiestaaa.fiestaaa
          EOF

      - name: Run tests
        run: flutter test --dart-define-from-file=.env.ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: Build production web image
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: Dockerfile
          push: false
          tags: ${{ env.IMAGE }}:release-candidate-${{ github.sha }}
          build-args: |
            FIESTAAA_API_BASE_URL=https://api.example.test
            FIESTAAA_APPLE_REDIRECT_URI=https://fiestaaa.example.test/auth/callback
            FIESTAAA_APPLE_SERVICE_ID=com.example.fiestaaa.web
            FIESTAAA_GOOGLE_WEB_CLIENT_ID=test-web-client-id.apps.googleusercontent.com
            FIESTAAA_SENTRY_DSN=
            FIESTAAA_SENTRY_ENVIRONMENT=ci
            FIESTAAA_SENTRY_RELEASE=release-candidate-${{ github.sha }}
            FIESTAAA_SENTRY_TRACES_SAMPLE_RATE=0
            FIREBASE_MESSAGING_SENDER_ID=123456789012
            FIREBASE_PROJECT_ID=fiestaaa-test
            FIREBASE_STORAGE_BUCKET=fiestaaa-test.firebasestorage.app
            FIREBASE_WEB_APP_ID=1:123456789012:web:testappid
            FIREBASE_WEB_MEASUREMENT_ID=
          secrets: |
            FIESTAAA_FCM_VAPID_KEY=test-vapid-key
            FIREBASE_WEB_API_KEY=test-web-api-key
            FIREBASE_AUTH_DOMAIN=fiestaaa-test.firebaseapp.com

  prepare-release:
    name: Version and Tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify
    outputs:
      build_number: ${{ steps.version.outputs.build_number }}
      release_sha: ${{ steps.tag.outputs.release_sha }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          ref: main

      - name: Validate release version
        id: version
        env:
          CUSTOM_VERSION: ${{ inputs.custom_version }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          set -euo pipefail
          release_type="${RELEASE_TYPE}"
          custom_version="${CUSTOM_VERSION}"
          build_number="${{ inputs.build_number }}"
          git fetch origin main --tags
          if [ -z "${build_number}" ]; then
            build_number="${GITHUB_RUN_NUMBER}"
          fi

          if [ "${release_type}" = "custom" ]; then
            version="${custom_version}"
            if [ -z "${version}" ]; then
              echo "::error::custom_version is required when release_type=custom"
              exit 1
            fi
          else
            if [ -n "${custom_version}" ]; then
              echo "::error::custom_version can only be set when release_type=custom"
              exit 1
            fi
            latest_tag="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
            if [ -n "${latest_tag}" ]; then
              current_version="${latest_tag#v}"
            else
              current_version="$(sed -nE 's/^version:[[:space:]]*([0-9]+)\.([0-9]+)\.([0-9]+)(\+[0-9]+)?.*/\1.\2.\3/p' pubspec.yaml | head -n 1)"
            fi
            if [ -z "${current_version}" ]; then
              echo "::error::No release tag found and pubspec.yaml version must use MAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH+BUILD"
              exit 1
            fi
            IFS=. read -r major minor patch <<< "${current_version}"
            case "${release_type}" in
              patch)
                patch=$((patch + 1))
                ;;
              minor)
                minor=$((minor + 1))
                patch=0
                ;;
              major)
                major=$((major + 1))
                minor=0
                patch=0
                ;;
              *)
                echo "::error::Unsupported release_type: ${release_type}"
                exit 1
                ;;
            esac
            version="${major}.${minor}.${patch}"
          fi

          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must use MAJOR.MINOR.PATCH, for example 1.2.3"
            exit 1
          fi
          if ! [[ "${build_number}" =~ ^[0-9]+$ ]]; then
            echo "::error::build_number must be a positive integer"
            exit 1
          fi
          tag="v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::Tag ${tag} already exists"
            exit 1
          fi
          {
            echo "build_number=${build_number}"
            echo "tag=${tag}"
            echo "version=${version}"
          } >> "${GITHUB_OUTPUT}"
          echo "::notice::Preparing ${release_type} release ${tag} build ${build_number}"

      - name: Update Flutter version
        env:
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # shellcheck disable=SC2016
          ruby -e '
            version = ENV.fetch("VERSION")
            build_number = ENV.fetch("BUILD_NUMBER")
            path = "pubspec.yaml"
            text = File.read(path)
            raise "pubspec.yaml version not found" unless text.sub!(/^version:\s*.+$/, "version: #{version}+#{build_number}")
            File.write(path, text)
          '

      - name: Commit and tag release
        id: tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- pubspec.yaml; then
            git add pubspec.yaml
            git commit -m "chore(release): ${TAG}"
          fi
          release_sha="$(git rev-parse HEAD)"
          git tag -a "${TAG}" -m "Release ${TAG}" "${release_sha}"
          git push origin "${TAG}"
          echo "release_sha=${release_sha}" >> "${GITHUB_OUTPUT}"

  publish-web:
    name: Publish Web Image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: prepare-release
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}

      - name: Check required build secrets
        env:
          FIESTAAA_API_BASE_URL: ${{ secrets.FIESTAAA_API_BASE_URL }}
          FIESTAAA_APPLE_REDIRECT_URI: ${{ secrets.FIESTAAA_APPLE_REDIRECT_URI }}
          FIESTAAA_APPLE_SERVICE_ID: ${{ secrets.FIESTAAA_APPLE_SERVICE_ID }}
          FIESTAAA_FCM_VAPID_KEY: ${{ secrets.FIESTAAA_FCM_VAPID_KEY }}
          FIESTAAA_GOOGLE_WEB_CLIENT_ID: ${{ secrets.FIESTAAA_GOOGLE_WEB_CLIENT_ID }}
          FIESTAAA_SENTRY_DSN: ${{ secrets.FIESTAAA_SENTRY_DSN }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_WEB_APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID }}
        run: |
          missing=0
          for var in FIESTAAA_API_BASE_URL FIESTAAA_APPLE_REDIRECT_URI FIESTAAA_APPLE_SERVICE_ID FIESTAAA_FCM_VAPID_KEY FIESTAAA_GOOGLE_WEB_CLIENT_ID FIESTAAA_SENTRY_DSN FIREBASE_MESSAGING_SENDER_ID FIREBASE_PROJECT_ID FIREBASE_STORAGE_BUCKET FIREBASE_WEB_API_KEY FIREBASE_WEB_APP_ID; do
            if [ -z "${!var}" ]; then
              echo "::error::$var manquant"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Login to GHCR
        uses: docker/login-action@v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: Prepare image tags
        id: image-tags
        env:
          TAG: ${{ needs.prepare-release.outputs.tag }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          {
            echo "tags<<EOF"
            echo "${IMAGE}:${TAG}"
            echo "${IMAGE}:${VERSION}"
            echo "${IMAGE}:latest"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.image-tags.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ needs.prepare-release.outputs.tag }}
            org.opencontainers.image.revision=${{ needs.prepare-release.outputs.release_sha }}
          build-args: |
            FIESTAAA_API_BASE_URL=${{ secrets.FIESTAAA_API_BASE_URL }}
            FIESTAAA_APPLE_REDIRECT_URI=${{ secrets.FIESTAAA_APPLE_REDIRECT_URI }}
            FIESTAAA_APPLE_SERVICE_ID=${{ secrets.FIESTAAA_APPLE_SERVICE_ID }}
            FIESTAAA_GOOGLE_WEB_CLIENT_ID=${{ secrets.FIESTAAA_GOOGLE_WEB_CLIENT_ID }}
            FIESTAAA_SENTRY_DSN=${{ secrets.FIESTAAA_SENTRY_DSN }}
            FIESTAAA_SENTRY_ENVIRONMENT=${{ vars.FIESTAAA_SENTRY_ENVIRONMENT || 'production' }}
            FIESTAAA_SENTRY_RELEASE=${{ needs.prepare-release.outputs.tag }}
            FIESTAAA_SENTRY_TRACES_SAMPLE_RATE=${{ vars.FIESTAAA_SENTRY_TRACES_SAMPLE_RATE || '0' }}
            FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
            FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
            FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}
            FIREBASE_WEB_APP_ID=${{ secrets.FIREBASE_WEB_APP_ID }}
            FIREBASE_WEB_MEASUREMENT_ID=${{ secrets.FIREBASE_WEB_MEASUREMENT_ID }}
          secrets: |
            FIESTAAA_FCM_VAPID_KEY=${{ secrets.FIESTAAA_FCM_VAPID_KEY }}
            FIREBASE_WEB_API_KEY=${{ secrets.FIREBASE_WEB_API_KEY }}
            FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }}

      - name: Generate image attestation
        if: steps.push.outputs.digest != '' && !github.event.repository.private
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  build-android-apk:
    name: Build Android APK
    needs: prepare-release
    uses: ./.github/workflows/build-android-apk.yml
    with:
      ref: ${{ needs.prepare-release.outputs.tag }}
      version: ${{ needs.prepare-release.outputs.version }}
      build_number: ${{ needs.prepare-release.outputs.build_number }}
      artifact_suffix: ${{ needs.prepare-release.outputs.tag }}
      require_signing: true
    secrets: inherit

  build-ios-ipa:
    name: Build iOS IPA
    needs: prepare-release
    if: ${{ inputs.build_ios }}
    uses: ./.github/workflows/build-ios-ipa.yml
    with:
      ref: ${{ needs.prepare-release.outputs.tag }}
      version: ${{ needs.prepare-release.outputs.version }}
      build_number: ${{ needs.prepare-release.outputs.build_number }}
      artifact_suffix: ${{ needs.prepare-release.outputs.tag }}
      export_method: ${{ inputs.ios_export_method }}
    secrets: inherit

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [prepare-release, publish-web, build-android-apk, build-ios-ipa]
    if: >-
      ${{
        always() &&
        needs.prepare-release.result == 'success' &&
        needs.publish-web.result == 'success' &&
        needs.build-android-apk.result == 'success' &&
        (needs.build-ios-ipa.result == 'success' || needs.build-ios-ipa.result == 'skipped')
      }}
    steps:
      - name: Download mobile artifacts
        uses: actions/download-artifact@v7.0.1
        with:
          pattern: fiestaaa-*-${{ needs.prepare-release.outputs.tag }}
          path: release-artifacts
          merge-multiple: true

      - name: Publish release notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          name: Fiestaaa Frontend ${{ needs.prepare-release.outputs.tag }}
          target_commitish: ${{ needs.prepare-release.outputs.release_sha }}
          generate_release_notes: true
          make_latest: true
          files: release-artifacts/**
          fail_on_unmatched_files: false
          body: |
            Web container image:
            `${{ env.IMAGE }}:${{ needs.prepare-release.outputs.tag }}`

            Digest:
            `${{ needs.publish-web.outputs.digest }}`

            Mobile build number:
            `${{ needs.prepare-release.outputs.build_number }}`

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [prepare-release, publish-web, github-release]
    if: ${{ inputs.deploy_to_vps }}
    environment:
      name: production
      url: https://fiestaaa.app
    env:
      TAG: ${{ needs.prepare-release.outputs.tag }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}

      - name: Check required deploy secrets
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          missing=0
          for var in VPS_HOST VPS_PORT VPS_SSH_KEY VPS_USER; do
            if [ -z "${!var}" ]; then
              echo "::error::$var manquant"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Check VPS bootstrap state
        id: bootstrap
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          key_path="${RUNNER_TEMP}/fiestaaa_deploy"
          printf '%s\n' "${VPS_SSH_KEY}" > "${key_path}"
          chmod 600 "${key_path}"
          api_image_tag="$(
            ssh -i "${key_path}" \
              -p "${VPS_PORT}" \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=accept-new \
              "${VPS_USER}@${VPS_HOST}" \
              "grep '^API_IMAGE_TAG=' ~/apps/fiestaaa/.env 2>/dev/null | cut -d= -f2- || true"
          )"
          rm -f "${key_path}"
          if [ -z "${api_image_tag}" ]; then
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Bootstrap initial non detecte: le deploy front est ignore jusqu'au workflow Bootstrap VPS Stack."
          else
            echo "ready=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Deploy to VPS
        if: steps.bootstrap.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: GHCR_USERNAME,GHCR_TOKEN,TAG
          script: |
            set -euo pipefail
            cd ~/apps/fiestaaa
            current_api_image_tag="$(grep '^API_IMAGE_TAG=' .env 2>/dev/null | cut -d= -f2- || true)"
            if [ -z "${current_api_image_tag}" ]; then
              echo "API_IMAGE_TAG missing in ~/apps/fiestaaa/.env. Seed both API_IMAGE_TAG and FRONT_IMAGE_TAG before the first deployment." >&2
              exit 1
            fi
            tmp_env="$(mktemp)"
            if [ -f .env ]; then
              grep -vE '^(API_IMAGE_TAG|FRONT_IMAGE_TAG)=' .env > "${tmp_env}" || true
            fi
            cat "${tmp_env}" > .env
            {
              echo "API_IMAGE_TAG=${current_api_image_tag}"
              echo "FRONT_IMAGE_TAG=${TAG}"
            } >> .env
            chmod 600 .env
            rm -f "${tmp_env}"
            if [ -n "${GHCR_TOKEN:-}" ]; then
              echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin
            else
              echo "GHCR_TOKEN absent: pull GHCR anonyme, les images doivent etre publiques."
            fi
            compose_cmd="docker compose"
            if ! docker compose version >/dev/null 2>&1; then
              if command -v docker-compose >/dev/null 2>&1; then
                compose_cmd="docker-compose"
              else
                echo "docker compose/docker-compose not found on the VPS" >&2
                exit 1
              fi
            fi
            ${compose_cmd} pull front
            ${compose_cmd} up -d --no-deps front
            ${compose_cmd} ps
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.tag }}

      - name: Verify public smoke checks
        if: steps.bootstrap.outputs.ready == 'true'
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors https://api.fiestaaa.app/health
          curl --fail --silent --show-error --head --retry 12 --retry-delay 5 --retry-all-errors https://fiestaaa.app

      - name: Setup Node for browser smoke check
        if: steps.bootstrap.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install browser smoke dependencies
        if: steps.bootstrap.outputs.ready == 'true'
        run: npm ci

      - name: Install Playwright Chromium
        if: steps.bootstrap.outputs.ready == 'true'
        run: npx playwright install --with-deps chromium

      - name: Verify browser smoke check
        if: steps.bootstrap.outputs.ready == 'true'
        run: npm run smoke:web -- --url https://fiestaaa.app
