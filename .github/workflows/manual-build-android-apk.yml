name: Manual Build Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Flutter build name, for example 1.2.3"
        required: true
        default: "1.0.0"
        type: string
      build_number:
        description: "Flutter build number"
        required: true
        default: "1"
        type: string
      require_signing:
        description: "Fail unless Android release signing secrets are present"
        required: true
        type: boolean
        default: true

jobs:
  build-android-apk:
    uses: ./.github/workflows/build-android-apk.yml
    with:
      ref: ${{ github.ref }}
      version: ${{ inputs.version }}
      build_number: ${{ inputs.build_number }}
      artifact_suffix: manual-${{ github.run_number }}
      require_signing: ${{ inputs.require_signing }}
    secrets: inherit
