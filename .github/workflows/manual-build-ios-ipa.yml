name: Manual Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Flutter build name, for example 1.2.3"
        required: true
        default: "1.0.0"
        type: string
      build_number:
        description: "Flutter build number"
        required: true
        default: "1"
        type: string
      export_method:
        description: "Xcode export method"
        required: true
        default: debugging
        type: choice
        options:
          - debugging
          - release-testing
          - app-store-connect

jobs:
  build-ios-ipa:
    uses: ./.github/workflows/build-ios-ipa.yml
    with:
      ref: ${{ github.ref }}
      version: ${{ inputs.version }}
      build_number: ${{ inputs.build_number }}
      artifact_suffix: manual-${{ github.run_number }}
      export_method: ${{ inputs.export_method }}
    secrets: inherit
