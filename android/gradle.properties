# Flutter debug engine artifacts need more heap during AndroidX transformation.
# Bound parallel workers so the daemon and Kotlin compiler fit hosted CI runners.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
android.useAndroidX=true
android.enableJetifier=true
# Flutter plugins still use the legacy Kotlin plugin and Android DSL.
android.builtInKotlin=false
android.newDsl=false
