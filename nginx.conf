server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'wasm-unsafe-eval' 'sha256-Mz3cULKmYM0+hcRmEfU0dCqvj9ZDQVjNE+yGH51hmXc=' 'sha256-2ucr+ETY534g68D+mqlS1WxbYGkmO8UPlqkA9R5eZtw=' https://appleid.cdn-apple.com https://accounts.google.com https://www.gstatic.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https: http://127.0.0.1:* http://localhost:*; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https: wss: http://127.0.0.1:* http://localhost:* ws://127.0.0.1:* ws://localhost:*; frame-src 'self' https://accounts.google.com https://appleid.apple.com; form-action 'self' https://accounts.google.com https://appleid.apple.com; manifest-src 'self'; media-src 'self' blob: data:;" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Ensure the service worker updates promptly
  location = /firebase-messaging-sw.js {
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'wasm-unsafe-eval' 'sha256-Mz3cULKmYM0+hcRmEfU0dCqvj9ZDQVjNE+yGH51hmXc=' 'sha256-2ucr+ETY534g68D+mqlS1WxbYGkmO8UPlqkA9R5eZtw=' https://appleid.cdn-apple.com https://accounts.google.com https://www.gstatic.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https: http://127.0.0.1:* http://localhost:*; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https: wss: http://127.0.0.1:* http://localhost:* ws://127.0.0.1:* ws://localhost:*; frame-src 'self' https://accounts.google.com https://appleid.apple.com; form-action 'self' https://accounts.google.com https://appleid.apple.com; manifest-src 'self'; media-src 'self' blob: data:;" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  location /assets/ {
    expires 7d;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'wasm-unsafe-eval' 'sha256-Mz3cULKmYM0+hcRmEfU0dCqvj9ZDQVjNE+yGH51hmXc=' 'sha256-2ucr+ETY534g68D+mqlS1WxbYGkmO8UPlqkA9R5eZtw=' https://appleid.cdn-apple.com https://accounts.google.com https://www.gstatic.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https: http://127.0.0.1:* http://localhost:*; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https: wss: http://127.0.0.1:* http://localhost:* ws://127.0.0.1:* ws://localhost:*; frame-src 'self' https://accounts.google.com https://appleid.apple.com; form-action 'self' https://accounts.google.com https://appleid.apple.com; manifest-src 'self'; media-src 'self' blob: data:;" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
    add_header Cache-Control "public";
  }
}
