server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  set $fiestaaa_csp "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://browser.sentry-cdn.com https://appleid.cdn-apple.com https://accounts.google.com https://www.gstatic.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://api.fiestaaa.app https://www.google.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.fiestaaa.app wss://api.fiestaaa.app https://accounts.google.com https://appleid.apple.com https://www.googleapis.com https://*.googleapis.com https://www.gstatic.com https://fonts.gstatic.com https://firebaseinstallations.googleapis.com https://fcmregistrations.googleapis.com https://*.sentry.io; frame-src 'self' https://accounts.google.com https://appleid.apple.com; form-action 'self' https://accounts.google.com https://appleid.apple.com; manifest-src 'self'; media-src 'self' blob: data:;";
  add_header Content-Security-Policy $fiestaaa_csp always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;

  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }

  # Ensure the service worker updates promptly
  location = /firebase-messaging-sw.js {
    add_header Content-Security-Policy $fiestaaa_csp always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  location /assets/ {
    expires 7d;
    add_header Content-Security-Policy $fiestaaa_csp always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cache-Control "public";
  }
}
