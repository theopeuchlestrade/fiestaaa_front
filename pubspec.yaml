name: fiestaaa_front
description: "Flutter frontend for Fiestaaa."
publish_to: 'none'
version: 0.3.1
homepage: https://fiestaaa.app
repository: https://github.com/theopeuchlestrade/fiestaaa_front
issue_tracker: https://github.com/theopeuchlestrade/fiestaaa_front/issues

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  flutter_localizations:
    sdk: flutter

  http: ^1.2.2
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^10.3.1
  share_plus: ^13.3.0
  intl: ^0.20.2
  url_launcher: ^6.3.0
  google_fonts: ^8.2.0
  web_socket_channel: ^3.0.3
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.1
  flutter_local_notifications: ^22.2.0
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.2
  google_identity_services_web: ^0.3.3+1
  sign_in_with_apple: ^8.1.0
  web: ^1.1.1
  image_picker: ^1.2.3
  sentry_flutter: ^9.26.0
  timezone: ^0.11.1
  go_router: ^17.0.1
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/logos/
