name: fiestaaa_front
description: "Flutter frontend for Fiestaaa."
publish_to: 'none'
version: 1.0.0+1
homepage: https://fiestaaa.app
repository: https://github.com/theopeuchlestrade/fiestaaa_front
issue_tracker: https://github.com/theopeuchlestrade/fiestaaa_front/issues

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.4
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^10.1.0
  share_plus: ^12.0.1
  intl: ^0.20.2
  url_launcher: ^6.3.0
  google_fonts: ^8.0.2
  web_socket_channel: ^3.0.3
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  permission_handler: ^12.0.1
  firebase_core: ^4.5.0
  firebase_messaging: ^16.1.2
  flutter_local_notifications: ^21.0.0
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.2
  google_identity_services_web: ^0.3.3+1
  sign_in_with_apple: ^8.0.0
  web: ^1.1.1
  flutter_launcher_icons: ^0.14.4
  image_picker: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/logos/
